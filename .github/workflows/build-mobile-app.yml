name: Build mobile app projects

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mobile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Prepare app web files
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Generate iOS project
        run: npx cap add ios

      - name: Sync Capacitor
        run: npx cap sync

      - name: Commit generated mobile projects
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android ios www package-lock.json
          git diff --cached --quiet || git commit -m "Generate iOS and Android app projects"
          git push
