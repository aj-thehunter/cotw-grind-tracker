name: Build mobile app projects

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build-mobile:
    if: ${{ !contains(github.event.head_commit.message, 'Generate iOS and Android app projects') }}
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Prepare app web files
        run: npm run build

      - name: Generate Android project if missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          else
            echo "Android project already exists; skipping cap add android."
          fi

      - name: Generate iOS project if missing
        run: |
          if [ ! -d ios ]; then
            npx cap add ios
          else
            echo "iOS project already exists; skipping cap add ios."
          fi

      - name: Sync Capacitor
        run: npx cap sync

      - name: Commit generated mobile projects
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android ios www package-lock.json
          git diff --cached --quiet || git commit -m "Generate mobile projects"
          git push
